name: weekly-pig-data-update

on:
  schedule:
    - cron: '0 1 * * 0'   # UTC 周日 01:00 = 北京时间周日 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取并更新数据（最多重试3次）
        run: |
          for i in 1 2 3; do
            python update_data.py && exit 0
            echo "第 $i 次尝试失败，90 秒后重试..."
            sleep 90
          done
          exit 1

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: 更新生猪产品数据 $(date +%F)" || echo "本次无数据变化"
          git push
