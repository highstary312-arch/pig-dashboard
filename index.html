<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fa; color:#2c3e50; }
  header { background:linear-gradient(135deg,#1b5e20,#2e7d32); color:#fff; padding:28px 20px; text-align:center; }
  header h1 { font-size:24px; margin-bottom:8px; }
  header p { font-size:13px; opacity:.85; }

  .toolbar button { padding:7px 18px; border:1px solid #2e7d32; background:#fff; color:#2e7d32; border-radius:20px; cursor:pointer; font-size:13px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(560px,1fr)); gap:20px; padding:20px; max-width:1500px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); overflow:hidden; }
  .card h2 { font-size:16px; padding:14px 18px 4px; }
  .card .unit { font-size:12px; color:#8a97a8; padding:0 18px 8px; }
  .chart { width:100%; height:380px; }
  .note { max-width:1500px; margin:0 auto 40px; padding:0 20px; font-size:12px; color:#8a97a8; line-height:1.9; }
  @media(max-width:640px){ .grid{grid-template-columns:1fr;padding:12px;} .chart{height:300px;} }
</style>
</head>

<div class="toolbar">

  <button id="btn-series">按时间序列查看</button>
</div>
<div class="grid" id="grid"></div>
<div class="note">

  生猪存栏为季度末数据。2. 2025年7月起"规模以上生猪定点屠宰企业屠宰量"口径调整为"生猪定点屠宰企业屠宰量"。
  3. 2023-01 屠宰量由官方1-2月累计值推算。4. 虚线缺口表示该期数据待补充。
</div>

<script>
const DB = JSON.parse(document.getElementById('pig-data').textContent);
document.getElementById('updated').textContent = '数据截至：' + DB.meta.updated;
let mode = 'compare';
const YEAR_COLORS = {'2023':'#5470c6','2024':'#91cc75','2025':'#fac858','2026':'#ee6666','2027':'#73c0de'};
const charts = [];
const QLIST = ['一季度','二季度','三季度','四季度'];

function monthOrQ(k){ return k.includes('-Q') ? QLIST[parseInt(k.slice(5))-1] : parseInt(k.slice(5)) + '月'; }

function buildMonthly(name, cfg){
  const years = [...new Set(Object.keys(cfg.data).map(k=>k.slice(0,4)))].sort();
  let option;
  if(mode==='compare'){
    option = {
      tooltip:{trigger:'axis'},
      legend:{top:0,data:years},
      grid:{left:60,right:20,top:36,bottom:30},
      xAxis:{type:'category',data:Array.from({length:12},(_,i)=>(i+1)+'月')},
      yAxis:{type:'value',scale:true,name:cfg.unit},
      series: years.map(y=>({name:y,type:'line',connectNulls:false,smooth:true,
        color:YEAR_COLORS[y],
        data:Array.from({length:12},(_,i)=>cfg.data[y+'-'+String(i+1).padStart(2,'0')] ?? null)}))
    };
  } else {
    const keys = Object.keys(cfg.data).sort();
    option = {
      tooltip:{trigger:'axis'},
      grid:{left:60,right:20,top:30,bottom:60},
      xAxis:{type:'category',data:keys.map(monthOrQ),axisLabel:{rotate:45,fontSize:10}},
      yAxis:{type:'value',scale:true,name:cfg.unit},
      series:[{name:name,type:'line',connectNulls:false,smooth:true,data:keys.map(k=>cfg.data[k]),areaStyle:{opacity:.12}}]
    };
  }
  return option;
}

function renderAll(){
  charts.forEach(c=>c.dispose()); charts.length=0;
  const grid = document.getElementById('grid'); grid.innerHTML='';
  const monthly = DB.monthly || {};
  const quarterly = DB.quarterly || {};
  const all = {...monthly, ...quarterly};
  const qNames = Object.keys(quarterly);
  for(const [name,cfg] of Object.entries(all)){
    const card = document.createElement('div'); card.className='card';
    const freq = qNames.includes(name) ? '季度' : '月度';
    card.innerHTML = `<h2>${name} <span style="font-size:12px;color:#8a97a8">（${freq}）</span></h2><div class="unit">单位：${cfg.unit}</div><div class="chart"></div>`;
    grid.appendChild(card);
    const ch = echarts.init(card.querySelector('.chart'));
    ch.setOption(buildMonthly(name,cfg));
    charts.push(ch);
  }
}
document.getElementById('btn-compare').onclick = e=>{mode='compare';setActive(e.target);renderAll();};
document.getElementById('btn-series').onclick = e=>{mode='series';setActive(e.target);renderAll();};
function setActive(btn){document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
renderAll();
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));
</script>
